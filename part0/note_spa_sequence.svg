<svg width="640" height="380" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <!-- Lifeline headers -->
  <rect x="40" y="20" width="180" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="130" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Browser (JS)</text>

  <rect x="440" y="20" width="140" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="510" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Server</text>

  <!-- Lifelines -->
  <line x1="130" y1="56" x2="130" y2="360" stroke="#888780" stroke-width="1.5"/>
  <line x1="510" y1="56" x2="510" y2="360" stroke="#888780" stroke-width="1.5"/>

  <!-- Note: user types and clicks save -->
  <rect x="45" y="75" width="170" height="34" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#412402">User types note,</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#412402">clicks Save</text>

  <!-- Note: JS updates page instantly -->
  <rect x="30" y="122" width="200" height="46" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="130" y="139" text-anchor="middle" font-size="11" fill="#412402">JS blocks page reload,</text>
  <text x="130" y="151" text-anchor="middle" font-size="11" fill="#412402">adds note to view</text>
  <text x="130" y="163" text-anchor="middle" font-size="11" fill="#412402">instantly</text>

  <!-- Arrow 1: AJAX POST -->
  <line x1="130" y1="200" x2="503" y2="200" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="#3d3d3a">AJAX POST note as JSON</text>

  <!-- Note: server saves -->
  <rect x="435" y="215" width="150" height="34" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="510" y="232" text-anchor="middle" font-size="11" fill="#412402">Save note to</text>
  <text x="510" y="244" text-anchor="middle" font-size="11" fill="#412402">notes array</text>

  <!-- Arrow 2: response (dashed) -->
  <line x1="510" y1="280" x2="137" y2="280" stroke="#3d3d3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#3d3d3a">201 Created (JSON)</text>

  <!-- Lifeline endpoints -->
  <circle cx="130" cy="360" r="3" fill="#888780"/>
  <circle cx="510" cy="360" r="3" fill="#888780"/>

  <defs>
    <marker id="arrowhead2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
