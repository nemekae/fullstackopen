<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- Lifeline headers -->
  <rect x="40" y="20" width="180" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="130" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Browser</text>

  <rect x="440" y="20" width="140" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="510" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Server</text>

  <!-- Lifelines -->
  <line x1="130" y1="56" x2="130" y2="400" stroke="#888780" stroke-width="1.5"/>
  <line x1="510" y1="56" x2="510" y2="400" stroke="#888780" stroke-width="1.5"/>

  <!-- Arrow 1: GET spa -->
  <line x1="130" y1="90" x2="503" y2="90" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrowhead3)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="#3d3d3a">GET /exampleapp/spa</text>

  <!-- Arrow 2: HTML shell (dashed) -->
  <line x1="510" y1="126" x2="137" y2="126" stroke="#3d3d3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead3)"/>
  <text x="320" y="118" text-anchor="middle" font-size="12" fill="#3d3d3a">HTML shell (empty page)</text>

  <!-- Arrow 3: GET css+js -->
  <line x1="130" y1="162" x2="503" y2="162" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrowhead3)"/>
  <text x="320" y="154" text-anchor="middle" font-size="12" fill="#3d3d3a">GET main.css, main.js</text>

  <!-- Arrow 4: css+js response (dashed) -->
  <line x1="510" y1="198" x2="137" y2="198" stroke="#3d3d3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead3)"/>
  <text x="320" y="190" text-anchor="middle" font-size="12" fill="#3d3d3a">CSS + JS files</text>

  <!-- Note: browser starts executing JS -->
  <rect x="30" y="212" width="200" height="34" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="130" y="229" text-anchor="middle" font-size="11" fill="#412402">Browser starts running</text>
  <text x="130" y="241" text-anchor="middle" font-size="11" fill="#412402">the JS app code</text>

  <!-- Arrow 5: GET data.json -->
  <line x1="130" y1="278" x2="503" y2="278" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrowhead3)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#3d3d3a">GET /exampleapp/data.json</text>

  <!-- Arrow 6: notes JSON (dashed) -->
  <line x1="510" y1="314" x2="137" y2="314" stroke="#3d3d3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead3)"/>
  <text x="320" y="306" text-anchor="middle" font-size="12" fill="#3d3d3a">Notes as JSON</text>

  <!-- Note: browser renders notes -->
  <rect x="30" y="328" width="200" height="34" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="130" y="345" text-anchor="middle" font-size="11" fill="#412402">JS renders notes</text>
  <text x="130" y="357" text-anchor="middle" font-size="11" fill="#412402">onto the page</text>

  <!-- Lifeline endpoints -->
  <circle cx="130" cy="400" r="3" fill="#888780"/>
  <circle cx="510" cy="400" r="3" fill="#888780"/>

  <defs>
    <marker id="arrowhead3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
