<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- Lifeline headers -->
  <rect x="60" y="20" width="140" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="130" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Browser</text>

  <rect x="440" y="20" width="140" height="36" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="510" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Server</text>

  <!-- Lifelines -->
  <line x1="130" y1="56" x2="130" y2="400" stroke="#888780" stroke-width="1.5"/>
  <line x1="510" y1="56" x2="510" y2="400" stroke="#888780" stroke-width="1.5"/>

  <!-- Note: user types and clicks save -->
  <rect x="55" y="75" width="150" height="34" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#412402">User types note,</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#412402">clicks Save</text>

  <!-- Arrow 1: POST -->
  <line x1="130" y1="140" x2="503" y2="140" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="#3d3d3a">POST /exampleapp/notes</text>

  <!-- Note: server saves -->
  <rect x="435" y="155" width="150" height="34" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="510" y="172" text-anchor="middle" font-size="11" fill="#412402">Save note to</text>
  <text x="510" y="184" text-anchor="middle" font-size="11" fill="#412402">notes array</text>

  <!-- Arrow 2: redirect (dashed) -->
  <line x1="510" y1="220" x2="137" y2="220" stroke="#3d3d3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="#3d3d3a">302 redirect to /notes</text>

  <!-- Arrow 3: GET -->
  <line x1="130" y1="260" x2="503" y2="260" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="320" y="252" text-anchor="middle" font-size="12" fill="#3d3d3a">GET /exampleapp/notes</text>

  <!-- Arrow 4: response (dashed) -->
  <line x1="510" y1="300" x2="137" y2="300" stroke="#3d3d3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#3d3d3a">HTML page with updated notes</text>

  <!-- Lifeline endpoints -->
  <circle cx="130" cy="400" r="3" fill="#888780"/>
  <circle cx="510" cy="400" r="3" fill="#888780"/>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
